<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ⚠️ `<base href="/" />` AND ITS WHOLE PURPOSE IS THE SUBPATH DEPLOY (ADR-0117, Cloudflare).
     The page lives at `o-inclusionista.jrocha.dev.br/game-15puzzle/`, and whatever the engine
     fetches as `heavy/<host><path>` with no leading slash would otherwise resolve to
     `/game-15puzzle/heavy/…` — inside the game's subpath, where the Router Worker's `/heavy/*`
     function cannot see it. Base at `/` sends every relative URL back to the domain root.

     ⚠️ AND THIS IS SAFE HERE FOR A REASON MEASURED, NOT ASSUMED: this game has NO runtime `fetch`
     and no `BaseTexture.from` with a relative path (ADR-0027 — procedural art, zero glyphs in the
     framebuffer). The platformer took three bites from this exact move (`clarity.map.txt`, the pad
     demo and the character atlas) because its DYNAMIC paths would also fall through the base. Any
     dynamic `<img src="foo.png">` or `fetch('assets/…')` added later becomes `/foo.png`, i.e. off
     the game, so the receipt from the platformer applies: use `${import.meta.env.BASE_URL}…` for
     anything the game itself fetches at runtime. -->
<base href="/" />
<title data-i18n="app.title">Quebra-cabeca deslizante</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- MARKUP REQUIRED by createGame: #game-region, #sr-status, #sr-alert. Anything missing does not
     throw — it lands in engine.problems, which the boot check asserts is empty. -->
<div id="stage-wrap">
  <div id="game-region" tabindex="-1">
    <!-- ⚠️ EMPTY ON PURPOSE, AND THAT IS THE CONVERSION. The world, the chrome column, the board
         and the panel are all created by the CARTRIDGE, inside this element, and removed by its
         `teardown()`. A page that pre-declared them would be a page a second game inherits.

         What stays here is the one thing `createGame` needs before the cartridge exists: the bar's
         host. It is inside the region because the engine publishes `--tap` (22·k, so 44 CSS px at
         the k=2 floor) on the region and nowhere else — see the long note in js/cartridge.ts, and
         its consequence: this shell must never blanket-empty the region. -->
    <div id="a11y-bar"></div>
  </div>
</div>

<p class="hint" data-i18n="app.keys">Setas navegam &middot; Enter desliza a peca &middot; K sonar</p>

<div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
<div id="sr-alert"  class="sr-only" role="alert"  aria-live="assertive"></div>

<!-- Empty host where installCvdFilters builds the six colour-vision filters at runtime. -->
<svg id="cvd" class="sr-only" aria-hidden="true"></svg>

<script type="module" src="./js/boot/standalone.ts"></script>

<!-- ⚠️ VLIBRAS IS GONE (step 11f). Engine 11 made the deaf-mode mechanism `engine.deafMode` and
     expects the sign-language interpreter to arrive through `host.interpreter`. The gov.br widget
     is no longer compatible with that interface — a button on the accessibility bar that opened a
     mode nobody translated for would be a worse state than silence. Resumed the day somebody picks
     a `host.interpreter` candidate (ADR-0010 pillar 2's own-engine interpreter would be it). The
     block below used to be the four `[vw]` hooks and the plugin script tag; neither is needed. -->
</body>
</html>
