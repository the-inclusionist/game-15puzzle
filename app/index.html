<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="app.title">Quebra-cabeca deslizante</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- MARKUP REQUIRED by createGame: #game-region, #sr-status, #sr-alert. Anything missing does not
     throw — it lands in engine.problems, which boot/main.ts asserts is empty. -->
<div id="stage-wrap">
  <div id="game-region" tabindex="-1">
    <!-- ⚠️ THE WORLD IS THIS ELEMENT, NOT THE REGION, and the distinction is load-bearing rather
         than tidy. The declaration's `world()` names what the engine may treat as the game, and the
         engine puts an empathy filter THERE: `blind` is `brightness(0)`, applied to a whole subtree.
         A CSS filter on an ancestor rasterises everything under it and a descendant CANNOT opt out —
         `filter: none` on a child is not an escape hatch, it is a no-op. So the panel has to be a
         SIBLING of the world and not a child of it, or the simulation blacks out the very control
         that turns the simulation off, and a child is locked inside it.
         The canvas, the tile grid and the title screen go in here. The panel stays outside. -->
    <div id="world"></div>
    <!-- The chrome column: the accessibility bar pinned at the top, the panel scrolling under it.
         ⚠️ BOTH ARE OUTSIDE #world, and for the same reason the panel already was: the engine puts
         the empathy filter on the element `world()` names, a CSS filter rasterises its whole subtree,
         and a descendant cannot opt out. `blind` is brightness(0), and these are the controls that
         turn `blind` off — inside the world they would go black with everything else. -->
    <div id="side">
      <!-- Where the engine mounts its seven accessibility icons. Empty on purpose: `createGame`
           writes into it, given `host.a11yBarHost`.
           ⚠️ OUR OWN ID, NEVER #title-icons. That is the platformer's id, and the engine's stylesheet
           positions it absolute at top:10px;left:50% for the platformer's title art. The 2048
           measured what that costs elsewhere: the bar landed on top of its HUD and elementFromPoint
           over the score column started returning a .pi-btn. -->
      <div id="a11y-bar"></div>
    </div>
  </div>
</div>

<p class="hint" data-i18n="app.keys">Setas navegam &middot; Enter desliza a peca &middot; K sonar</p>

<div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
<div id="sr-alert"  class="sr-only" role="alert"  aria-live="assertive"></div>

<!-- Empty host where installCvdFilters builds the six colour-vision filters at runtime. -->
<svg id="cvd" class="sr-only" aria-hidden="true"></svg>

<script type="module" src="./js/boot/main.ts"></script>

<!-- ============================= LIBRAS, AND IT IS ONLINE-ONLY =============================
     The engine's accessibility bar already mounts a Libras button and already wires it to
     `toggleLibras` (create-game.js:253) — the MODE has existed here since the bar went up. What was
     missing was a translator for it to drive, which is this: four hooks the gov.br plugin looks for,
     and the plugin.

     ⚠️ THIS IS THE ONLY THIRD-PARTY, NETWORK-REQUIRED THING ON THE PAGE, and saying so is the point.
     Everything else this game needs is in its own build, including the font. The engine's own note
     beside `ui/vlibras.ts` says why it is interim: the Dev decided the interpreter should appear in
     FRONT of the screen while audio plays and leave afterwards, with nothing to click, and the gov.br
     widget cannot do that — it is a docked panel that translates the text of an element you click.
     ADR-0010's pillar 2 therefore plans an interpreter of our own. Until then, a button that toggles
     a mode and translates nothing is the half-truth worth removing, so the widget is mounted.

     The plugin re-parents itself: it attaches `#vlibras-access-wrapper` straight onto `<body>` and
     leaves the wrapper below empty. The engine learned that the expensive way — it used to read the
     panel's OPEN state from this block's geometry, the block became 747x0, and the detector answered
     "open" for ever: the layout reserved 380px for an interpreter that was not there and pushed the
     canvas to `left: -136`. So nothing here may be measured, and nothing here is.

     ⚠️ AND NO `integrity=` HASH, WHICH IS A DECISION AND NOT AN OVERSIGHT. Subresource Integrity
     needs a versioned URL; `vlibras.gov.br/app/vlibras-plugin.js` is a single unversioned address
     that the government updates in place. A pinned hash would hold until their next release and then
     turn "the interpreter is out of date" into "the interpreter silently never loads" — the failure
     lands on a deaf child, and the only trace is a console warning nobody is reading. The exposure it
     would buy against is a compromise of a federal accessibility endpoint that the same page is
     already trusting to render on top of it. If gov.br ever publishes a versioned URL, this becomes
     an ordinary omission and should be fixed. -->
<div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>try{ if(window.VLibras) new window.VLibras.Widget('https://vlibras.gov.br/app'); }
  catch(e){ console.warn('VLibras unavailable (offline?).', e); }</script>
</body>
</html>
